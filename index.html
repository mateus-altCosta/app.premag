<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6F8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('premag-tema') || 'sistema'
          var dark =
            t === 'escuro' ||
            (t === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.tema = dark ? 'escuro' : 'claro'
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#12161c')
        } catch (e) {}
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PREMAG" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>PREMAG · Apropriação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
